[package]
name = "argine-backend"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Argine backend — river level monitoring & forecasting"
publish = false

[features]
# DB-backed integration tests (require a reachable Postgres/TimescaleDB via DATABASE_URL).
# Off by default so `cargo test` runs DB-free locally; CI enables it via --all-features.
integration = []

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
# rustls (not native-tls): no OpenSSL in the distroless runtime image (SECURITY.md §10).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# No TLS feature: local/compose Postgres connects over the internal network without TLS.
# Add a tls feature when connecting to a managed DB over the public internet.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "time"] }
# Maps Postgres timestamptz to time::OffsetDateTime; parsing/macros decode ARPA's naive
# timestamps; serde-well-known (de)serializes API timestamps as RFC 3339.
time = { version = "0.3", features = ["macros", "parsing", "serde-well-known"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Mock the ARPA HTTP API in tests — never hit the real endpoint in CI (CLAUDE.md).
wiremock = "0.6"
