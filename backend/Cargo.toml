[package]
name = "argine-backend"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Argine backend — river level monitoring & forecasting"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
