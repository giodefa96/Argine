version: 2
updates:
  # Rust backend dependencies
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Frontend dependencies (the "npm" ecosystem also handles pnpm lockfiles)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Backend container base images — keeps the pinned digests current
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  # GitHub Actions used in our workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
