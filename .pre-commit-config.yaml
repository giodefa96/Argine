# Local defense layer — git hooks that mirror the CI security gate, so problems
# are caught on your machine BEFORE they ever reach git history or a PR.
#
# Install once:   make hooks        (or: pre-commit install --install-hooks && pre-commit install -t pre-push)
# Run manually:   pre-commit run --all-files
#
# Two speeds:
#   - pre-commit stage: fast checks on every commit (secrets, hygiene, fmt)
#   - pre-push stage:   heavier checks before pushing (clippy, cargo-deny, npm audit)
#
# Local hooks self-skip until backend/ and frontend/ exist (matches CI behaviour).

default_install_hook_types: [pre-commit, pre-push]

repos:
  # --- General hygiene + private-key detection -------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key            # blocks committing PEM / SSH private keys
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # --- Secret scanning (THE most important local hook) -----------------------
  # Stops credentials/tokens from ever entering git history. Same engine as CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Project checks (mirror CI). Guarded so they no-op until code exists ----
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (check)
        language: system
        pass_filenames: false
        files: ^backend/.*\.rs$
        entry: bash -c 'test -f backend/Cargo.toml || exit 0; cd backend && cargo fmt --all -- --check'

      - id: cargo-clippy
        name: cargo clippy (-D warnings)
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^backend/
        entry: bash -c 'test -f backend/Cargo.toml || exit 0; cd backend && cargo clippy --all-targets -- -D warnings'

      - id: cargo-deny
        name: cargo deny (advisories/licenses/sources)
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^backend/
        entry: bash -c 'test -f backend/Cargo.toml || exit 0; cd backend && cargo deny check'

      - id: npm-audit
        name: npm audit (high/critical)
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^frontend/
        entry: bash -c 'test -f frontend/package.json || exit 0; cd frontend && npm audit --audit-level=high'
