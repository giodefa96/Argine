# pnpm settings live here. The package.json "pnpm" field is deprecated and ignored by
# pnpm 11 (it emits a warning), so settings belong in this file.
# Allowlist of dependencies permitted to run install/build scripts — everything
# else is blocked by default (supply-chain defense, SECURITY.md §13).
onlyBuiltDependencies:
  - esbuild
# Acknowledged but intentionally NOT built: msw's postinstall only writes the browser
# service worker (mockServiceWorker.js), which we don't use — tests mock at the node layer
# (Vitest) and via Playwright route interception.
allowBuilds:
  msw: false
